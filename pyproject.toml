[project]
name = "rag-pipeline"
version = "0.1.0"
description = "RAG pipeline"
requires-python = ">=3.13"

dependencies = [
    # LangChain
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "langchain-community>=0.4.2",

    # Document loading
    "pypdf>=6.19.0",
    "unstructured>=0.18.0",
    "msoffcrypto-tool>=5.4.2",

    # Excel / tabular data
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",

    # Vector databases
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",

    # Embeddings / ML dependencies
    "sentence-transformers>=5.0.0",

    # Utilities
    "tqdm>=4.70.1",
    "pydantic>=2.13.5",
]

[project.scripts]
rag-pipeline = "rag_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
